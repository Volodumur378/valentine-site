<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Валентинка</title>
    <style>
        body {
            background: linear-gradient(to bottom, white, #ffccdd);
            text-align: center;
            font-family: 'Arial', sans-serif;
            color: #d63384;
            overflow: hidden;
        }
        .container {
            position: relative;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .heart {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: red;
            clip-path: path('M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z');
            opacity: 0.7;
        }
        .falling-heart {
            position: absolute;
            top: -50px;
            left: 50%;
            background-color: red;
            clip-path: path('M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z');
            opacity: 0.5;
            animation: fall linear infinite;
        }
        @keyframes fall {
            from {
                transform: translateY(0);
                opacity: 0.8;
            }
            to {
                transform: translateY(100vh);
                opacity: 0;
            }
        }
        .hidden {
            display: none;
        }
        .button {
            padding: 15px 30px;
            font-size: 20px;
            background-color: #ff85a2;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            color: white;
            transition: 0.3s;
        }
        .button:hover {
            background-color: #ff4d6d;
        }
        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }
        #message {
            display: inline-block;
            overflow: hidden;
            white-space: nowrap;
            border-right: 3px solid;
            font-size: 24px;
            animation: typing 3s steps(30) forwards;
            visibility: hidden;
            text-shadow: 2px 2px 4px white;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="button" onclick="showMessage(event)">Тицьни на мене</button>
        <h1 id="message">Я кохаю тебе сильніше за всіх! 💕💖😽</h1>
    </div>
    <script>
        function createFallingHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('falling-heart');
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.width = Math.random() * 20 + 20 + 'px';
                heart.style.height = heart.style.width;
                heart.style.animationDuration = Math.random() * 3 + 2 + 's';
                document.body.appendChild(heart);
                setTimeout(() => { heart.remove(); }, 5000);
            }, 300);
        }
        
        function showMessage(event) {
            document.querySelector('.button').style.display = 'none';
            createHeartExplosion(window.innerWidth / 2, window.innerHeight / 2);
            setTimeout(() => {
                document.getElementById('message').style.visibility = 'visible';
            }, 1000);
        }
        
        function createHeartExplosion(x, y) {
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.classList.add('heart');
                    heart.style.width = Math.random() * 20 + 20 + 'px';
                    heart.style.height = heart.style.width;
                    heart.style.left = `${x}px`;
                    heart.style.top = `${y}px`;
                    document.body.appendChild(heart);
                    let angle = Math.random() * 2 * Math.PI;
                    let distance = Math.random() * window.innerWidth * 0.6;
                    heart.style.transition = 'transform 2s ease-out, opacity 2s ease-out';
                    setTimeout(() => {
                        heart.style.transform = `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px)`;
                        heart.style.opacity = '0';
                    }, 10);
                    setTimeout(() => { heart.remove(); }, 2000);
                }, i * 10);
            }
        }
        
        createFallingHearts();
    </script>
</body>
</html>
